name: Build Android AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Instalar dependências do projeto
      run: npm install --legacy-peer-deps

    - name: Compilar projeto web
      run: npm run build

    - name: Adicionar plataforma Android no Capacitor
      run: npx cap add android || true

    - name: Sincronizar projeto com Capacitor Android
      run: npx cap sync android

    - name: Configurar JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Conceder permissão de execução para o Gradle
      working-directory: android
      run: chmod +x gradlew

    - name: Gerar AAB de Release
      working-directory: android
      run: ./gradlew bundleRelease

    - name: Salvar o arquivo AAB nos Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
